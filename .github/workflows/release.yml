name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            arch: x86_64
          - goos: linux
            goarch: arm64
            arch: aarch64
          - goos: darwin
            goarch: amd64
            arch: x86_64
          - goos: darwin
            goarch: arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o mydml ./cmd/mydml
          chmod +x mydml

      - name: Package tarball
        run: tar czf mydml_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz mydml

      - name: Install nfpm
        if: matrix.goos == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Package deb
        if: matrix.goos == 'linux'
        run: |
          export ARCH=${{ matrix.arch }}
          export VERSION=${VERSION}
          nfpm pkg -f nfpm.yaml --packager deb -t mydml_${{ matrix.goarch }}.deb

      - name: Package rpm
        if: matrix.goos == 'linux'
        run: |
          export ARCH=${{ matrix.arch }}
          export VERSION=${VERSION}
          nfpm pkg -f nfpm.yaml --packager rpm -t mydml_${{ matrix.goarch }}.rpm

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.deb
            *.rpm
